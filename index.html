<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
  { "imports": { "luxon": "https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/es6/luxon.js" } }
</script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<header class="container-fluid">
  <nav>
    <ul><li><strong>Travel Planner</strong></li></ul>
  </nav>
</header>

<main class="container-fluid layout">
  <aside class="sidebar">
    <article id="trip">
      <label>
        Trip
        <select id="trip-picker"></select>
      </label>
      <label>
        Starts on
        <input type="date" id="trip-start">
      </label>
      <div class="actions">
        <button class="secondary outline" data-action="rename-trip">Rename</button>
        <button class="secondary outline" data-action="new-trip">New trip</button>
        <button class="secondary outline" data-action="delete-trip">Delete</button>
      </div>
    </article>

    <article id="options">
      <hgroup>
        <h2>Options</h2>
        <p>Checked options show on the calendar.</p>
      </hgroup>
      <ul id="option-list" class="option-list"></ul>
      <button class="secondary outline" data-action="add-option">New option</button>
    </article>

    <article id="option-detail" class="option-detail"></article>
  </aside>
  <div id="calendar"></div>
</main>

<dialog id="ask">
  <article>
    <h2></h2>
    <form method="dialog" id="ask-form">
      <p></p>
      <input name="answer" aria-label="Answer" required>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="ask-form" value="ok">OK</button>
    </footer>
  </article>
</dialog>
</body>
</html>
