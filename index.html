<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
  { "imports": { "luxon": "https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/es6/luxon.js" } }
</script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<header class="container-fluid">
  <nav>
    <ul><li><strong>Travel Planner</strong></li></ul>
    <ul>
      <li><button class="secondary outline" id="export">Export</button></li>
      <li><button class="secondary outline" id="import">Import</button></li>
      <li><button class="secondary outline" id="open-settings">Settings</button></li>
    </ul>
  </nav>
</header>

<main class="container-fluid layout">
  <aside class="sidebar">
    <article id="trip">
      <label>
        Trip
        <select id="trip-picker"></select>
      </label>
      <label>
        Starts on
        <input type="date" id="trip-start">
      </label>
      <div class="actions">
        <button class="secondary outline" data-action="rename-trip">Rename</button>
        <button class="secondary outline" data-action="new-trip">New trip</button>
        <button class="secondary outline" data-action="delete-trip">Delete</button>
      </div>
    </article>

    <article id="search">
      <hgroup>
        <h2>Find flights</h2>
        <p>Opens Google Flights in a new tab. Copy a result, then use Paste flights below.</p>
      </hgroup>
      <form id="search-form">
        <div class="grid">
          <label>From <input name="from" list="airports" placeholder="JFK" required></label>
          <label>To <input name="to" list="airports" placeholder="LAX" required></label>
        </div>
        <div class="grid">
          <label>Leave <input type="date" name="depart"></label>
          <label>Return <input type="date" name="returns"></label>
        </div>
        <button>Search Google Flights</button>
      </form>
    </article>

    <article id="options">
      <hgroup>
        <h2>Options</h2>
        <p>Checked options show on the calendar.</p>
      </hgroup>
      <ul id="option-list" class="option-list"></ul>
      <button class="secondary outline" data-action="add-option">New option</button>
    </article>

    <article id="option-detail" class="option-detail"></article>
  </aside>
  <div id="calendar"></div>
</main>

<dialog id="paste-dialog">
  <article>
    <h2></h2>
    <form method="dialog" id="paste-form">
      <label>
        Text copied from Google Flights
        <textarea name="text" rows="8" placeholder="Mon, Oct 5&#10;Delta&#10;6:00 AM – 9:32 AM&#10;JFK–LAX&#10;$289"></textarea>
      </label>
      <output></output>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="paste-form" value="add">Add flights</button>
    </footer>
  </article>
</dialog>

<dialog id="flight-dialog">
  <article>
    <h2></h2>
    <form method="dialog" id="flight-form">
      <div class="grid">
        <label>Airline <input name="airline" placeholder="Delta"></label>
        <label>Flight number <input name="flightNumber" placeholder="DL 123"></label>
      </div>
      <fieldset>
        <legend>Leaves</legend>
        <div class="grid">
          <label>Airport <input name="from" list="airports" placeholder="JFK" maxlength="4" required></label>
          <label>Timezone <input name="fromTz" list="timezones" placeholder="America/New_York" required></label>
        </div>
        <label>Local time <input type="datetime-local" name="departs" required></label>
      </fieldset>
      <fieldset>
        <legend>Lands</legend>
        <div class="grid">
          <label>Airport <input name="to" list="airports" placeholder="LAX" maxlength="4" required></label>
          <label>Timezone <input name="toTz" list="timezones" placeholder="America/Los_Angeles" required></label>
        </div>
        <label>Local time <input type="datetime-local" name="arrives" required></label>
      </fieldset>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="flight-form" value="save"></button>
    </footer>
  </article>
</dialog>

<dialog id="settings-dialog">
  <article>
    <h2>Settings</h2>
    <form method="dialog" id="settings-form">
      <fieldset>
        <legend>Calendar</legend>
        <label>
          Show times in this timezone
          <input name="displayTz" list="timezones" required>
        </label>
        <div class="grid">
          <label>Also label times in <input name="extraTimezone1" list="timezones" placeholder="Los Angeles"></label>
          <label>and in <input name="extraTimezone2" list="timezones" placeholder="London"></label>
        </div>
        <div class="grid">
          <label>Days to show <input type="number" name="daysToShow" min="1" max="7" required></label>
          <label>
            Week starts on
            <select name="weekStart">
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Time around each flight, in minutes</legend>
        <label>Getting to the airport <input type="number" name="minutesToAirport" min="0" step="5" required></label>
        <label>At the airport before takeoff <input type="number" name="minutesAtAirport" min="0" step="5" required></label>
        <label>Getting away after landing <input type="number" name="minutesFromAirport" min="0" step="5" required></label>
      </fieldset>
      <fieldset>
        <legend>Usual sleep</legend>
        <label>
          <input type="checkbox" role="switch" name="sleepEnabled">
          Shade my usual sleep hours on the calendar
        </label>
        <div class="grid">
          <label>Bedtime <input type="time" name="sleepStart" required></label>
          <label>Wake up <input type="time" name="sleepEnd" required></label>
        </div>
        <label>
          Timezone my body clock is on
          <input name="sleepTz" list="timezones">
        </label>
      </fieldset>
      <label>
        Currency
        <input name="currency" maxlength="3" placeholder="USD" required>
      </label>
      <fieldset>
        <legend>Google Calendar</legend>
        <p id="google-status"></p>
        <ul id="google-calendars" class="google-calendars"></ul>
        <div class="actions">
          <button type="button" class="secondary" id="google-connect">Connect Google Calendar</button>
          <button type="button" class="secondary outline" id="google-disconnect">Disconnect</button>
        </div>
        <label>
          OAuth client ID
          <input name="googleClientId" placeholder="…apps.googleusercontent.com">
          <small>Sign-in only works on the web addresses this ID allows. Connecting and choosing calendars take effect right away.</small>
        </label>
      </fieldset>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="settings-form" value="save">Save</button>
    </footer>
  </article>
</dialog>

<dialog id="ask">
  <article>
    <h2></h2>
    <form method="dialog" id="ask-form">
      <p></p>
      <input name="answer" aria-label="Answer" required>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="ask-form" value="ok">OK</button>
    </footer>
  </article>
</dialog>

<input type="file" id="import-file" accept="application/json" hidden>
<datalist id="airports"></datalist>
<datalist id="timezones"></datalist>
</body>
</html>
