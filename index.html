<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
  { "imports": { "luxon": "https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/es6/luxon.js" } }
</script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<header class="container-fluid">
  <nav>
    <ul><li><strong>Travel Planner</strong></li></ul>
  </nav>
</header>

<main class="container-fluid layout">
  <aside class="sidebar">
    <article id="trip">
      <label>
        Trip
        <select id="trip-picker"></select>
      </label>
      <label>
        Starts on
        <input type="date" id="trip-start">
      </label>
      <div class="actions">
        <button class="secondary outline" data-action="rename-trip">Rename</button>
        <button class="secondary outline" data-action="new-trip">New trip</button>
        <button class="secondary outline" data-action="delete-trip">Delete</button>
      </div>
    </article>

    <article id="options">
      <hgroup>
        <h2>Options</h2>
        <p>Checked options show on the calendar.</p>
      </hgroup>
      <ul id="option-list" class="option-list"></ul>
      <button class="secondary outline" data-action="add-option">New option</button>
    </article>

    <article id="option-detail" class="option-detail"></article>
  </aside>
  <div id="calendar"></div>
</main>

<dialog id="paste-dialog">
  <article>
    <h2></h2>
    <form method="dialog" id="paste-form">
      <label>
        Text copied from Google Flights
        <textarea name="text" rows="8" placeholder="Mon, Oct 5&#10;Delta&#10;6:00 AM – 9:32 AM&#10;JFK–LAX&#10;$289"></textarea>
      </label>
      <output></output>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="paste-form" value="add">Add flights</button>
    </footer>
  </article>
</dialog>

<dialog id="flight-dialog">
  <article>
    <h2></h2>
    <form method="dialog" id="flight-form">
      <div class="grid">
        <label>Airline <input name="airline" placeholder="Delta"></label>
        <label>Flight number <input name="flightNumber" placeholder="DL 123"></label>
      </div>
      <fieldset>
        <legend>Leaves</legend>
        <div class="grid">
          <label>Airport <input name="from" list="airports" placeholder="JFK" maxlength="4" required></label>
          <label>Timezone <input name="fromTz" list="timezones" placeholder="America/New_York" required></label>
        </div>
        <label>Local time <input type="datetime-local" name="departs" required></label>
      </fieldset>
      <fieldset>
        <legend>Lands</legend>
        <div class="grid">
          <label>Airport <input name="to" list="airports" placeholder="LAX" maxlength="4" required></label>
          <label>Timezone <input name="toTz" list="timezones" placeholder="America/Los_Angeles" required></label>
        </div>
        <label>Local time <input type="datetime-local" name="arrives" required></label>
      </fieldset>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="flight-form" value="save"></button>
    </footer>
  </article>
</dialog>

<dialog id="ask">
  <article>
    <h2></h2>
    <form method="dialog" id="ask-form">
      <p></p>
      <input name="answer" aria-label="Answer" required>
    </form>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button form="ask-form" value="ok">OK</button>
    </footer>
  </article>
</dialog>

<datalist id="airports"></datalist>
<datalist id="timezones"></datalist>
</body>
</html>
